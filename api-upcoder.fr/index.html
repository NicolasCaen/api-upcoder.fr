<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testeur d'API *</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        select, textarea, input[type="text"], button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Testeur d'API</h1>

        <!-- Menu déroulant pour choisir la route -->
        <label for="apiRoute">Choisissez une route :</label>
        <select id="apiRoute">
            <!-- Options seront générées dynamiquement -->
        </select>

        <!-- Entrée pour le contenu Gutenberg -->
        <textarea id="inputGutenberg" placeholder="Insérez votre contenu Gutenberg ici..."></textarea>

        <!-- Bouton pour extraire la structure -->
        <button onclick="extractStructure()">Extraire Structure</button>

        <!-- Affichage de la structure extraite -->
        <h2>Structure Extraite :</h2>
        <textarea id="outputStructured" readonly placeholder="La structure extraite apparaîtra ici..."></textarea>

        <!-- Affichage des textes extraits -->
        <h2>Textes Extraits :</h2>
        <textarea id="outputTextMapping" readonly placeholder="Les textes extraits apparaîtront ici au format JSON..."></textarea>

        <!-- Entrée pour les textes modifiés -->
        <h2>Textes Modifiés :</h2>
        <textarea id="inputModifiedTexts" placeholder="Insérez les textes modifiés ici (format JSON)"></textarea>

        <!-- Bouton pour réinjecter le texte -->
        <button onclick="reinjectText()">Réinjecter Texte</button>

        <!-- Résultat final -->
        <h2>Résultat Final :</h2>
        <textarea id="outputFinal" readonly placeholder="Le résultat final apparaîtra ici..."></textarea>

        <!-- Zone d'erreur -->
        <div id="errorMessage" class="error" style="display: none;"></div>
    </div>

    <script>
        // Fonction pour charger les routes depuis l'API
        async function loadRoutes() {
            try {
                const response = await fetch('https://api.upcoder.fr/get-routes');
                if (!response.ok) {
                    throw new Error(`Erreur lors du chargement des routes : ${response.status} - ${response.statusText}`);
                }

                const routes = await response.json();
                const selectElement = document.getElementById('apiRoute');

                // Ajouter les options au menu déroulant
                routes.forEach(route => {
                    const option = document.createElement('option');
                    option.value = route.path;
                    option.textContent = `${route.path} (${route.methods.join(', ')})`;
                    selectElement.appendChild(option);
                });
            } catch (error) {
                console.error(error);
                alert(`Impossible de charger les routes : ${error.message}`);
            }
        }

        // Charger les routes au chargement de la page
        window.onload = loadRoutes;

        // Fonction pour extraire la structure
        async function extractStructure() {
            // Masquer l'erreur précédente (si présente)
            const errorMessageDiv = document.getElementById('errorMessage');
            errorMessageDiv.style.display = 'none';
            errorMessageDiv.textContent = '';

            // Récupérer le contenu Gutenberg
            const gutenbergContent = document.getElementById('inputGutenberg').value;

            if (!gutenbergContent.trim()) {
                alert("Veuillez insérer du contenu valide.");
                return;
            }

            try {
                // Envoyer une requête POST à /extract-structure
                const response = await fetch('https://api.upcoder.fr/extract-structure', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ gutenberg: gutenbergContent })
                });

                if (!response.ok) {
                    throw new Error(`Erreur API : ${response.status} - ${response.statusText}`);
                }

                const resultData = await response.json();
                const structuredHtml = resultData['structured_html'];
                const textMapping = resultData['text_mapping'];

                // Afficher les résultats
                document.getElementById('outputStructured').value = structuredHtml;
                document.getElementById('outputTextMapping').value = JSON.stringify(textMapping, null, 2);

                alert("Structure extraite avec succès !");
            } catch (error) {
                errorMessageDiv.style.display = 'block';
                errorMessageDiv.textContent = `Une erreur est survenue : ${error.message}`;
            }
        }

        // Fonction pour réinjecter le texte
        async function reinjectText() {
            // Masquer l'erreur précédente (si présente)
            const errorMessageDiv = document.getElementById('errorMessage');
            errorMessageDiv.style.display = 'none';
            errorMessageDiv.textContent = '';

            // Récupérer la structure modifiée et les textes modifiés
            const structuredHtml = document.getElementById('outputStructured').value;
            const modifiedTextsInput = document.getElementById('inputModifiedTexts').value;

            if (!structuredHtml.trim() || !modifiedTextsInput.trim()) {
                alert("Veuillez insérer des données valides pour la structure et les textes modifiés.");
                return;
            }

            try {
                // Convertir les textes modifiés en tableau
                const modifiedTexts = JSON.parse(modifiedTextsInput);

                // Envoyer une requête POST à /reinject-text
                const response = await fetch('https://api.upcoder.fr/reinject-text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        structured_html: structuredHtml,
                        modified_texts: modifiedTexts
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erreur API : ${response.status} - ${response.statusText}`);
                }

                const resultData = await response.json();
                const finalHtml = resultData['gutenberg'];

                // Afficher le résultat final
                document.getElementById('outputFinal').value = finalHtml;

                alert("Texte réinjecté avec succès !");
            } catch (error) {
                errorMessageDiv.style.display = 'block';
                errorMessageDiv.textContent = `Une erreur est survenue : ${error.message}`;
            }
        }
    </script>
</body>
</html>
